plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adamwyatt.subtitlefinder'
    compileSdk 35

    signingConfigs {
        stable {
            storeFile file('../subtitlefinder.keystore')
            storePassword 'subtitlefinder2026'
            keyAlias 'subtitlefinder'
            keyPassword 'subtitlefinder2026'
        }
    }

    defaultConfig {
        applicationId "com.adamwyatt.subtitlefinder"
        minSdk 22
        targetSdk 30
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

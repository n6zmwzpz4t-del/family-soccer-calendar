name: Refresh Finn and Tate shortcut icon

on:
  push:
    paths:
      - '.github/workflows/refresh-shortcut-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update icon URL
        shell: bash
        run: |
          sed -i 's/apple-touch-icon.png/ft-sports-icon-20260911.png/g' docs/index.html

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Force-refresh Finn and Tate shortcut icon"
          git push

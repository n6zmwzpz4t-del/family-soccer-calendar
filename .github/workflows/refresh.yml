name: Refresh Finn and Tate sports calendar

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths-ignore:
      - "docs/fixtures.ics"
      - "docs/debug.json"

permissions:
  contents: write

concurrency:
  group: finn-tate-sports-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install --with-deps chromium

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit updated calendar
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/fixtures.ics docs/debug.json

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi

          git commit -m "Refresh Finn and Tate sports fixtures"

          for attempt in 1 2 3; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Calendar successfully pushed."
              exit 0
            fi

            echo "Push attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Unable to push after 3 attempts."
          exit 1

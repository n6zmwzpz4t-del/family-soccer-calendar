name: Refresh Finn and Tate sports calendar

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths-ignore:
      - "docs/fixtures.ics"
      - "docs/debug.json"

permissions:
  contents: write

concurrency:
  group: finn-tate-sports-calendar-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install --with-deps chromium

      - name: Generate and publish calendar
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"

            # Always start with the latest files from GitHub.
            git fetch origin main
            git reset --hard origin/main

            # Keep a copy of the currently published calendar.
            if [ -f docs/fixtures.ics ]; then
              cp docs/fixtures.ics /tmp/fixtures-before.ics
            else
              touch /tmp/fixtures-before.ics
            fi

            # Check Squadi and regenerate the calendar.
            python generate_calendar.py

            # Create comparison copies that ignore DTSTAMP.
            #
            # DTSTAMP changes every run even if the actual fixture
            # information has not changed.
            sed '/^DTSTAMP:/d' /tmp/fixtures-before.ics \
              | tr -d '\r' \
              > /tmp/fixtures-before-compare.ics

            sed '/^DTSTAMP:/d' docs/fixtures.ics \
              | tr -d '\r' \
              > /tmp/fixtures-after-compare.ics

            # If the meaningful calendar information is identical,
            # restore the existing generated files and finish.
            if cmp -s \
              /tmp/fixtures-before-compare.ics \
              /tmp/fixtures-after-compare.ics
            then
              echo "No fixture changes detected."
              echo "Nothing will be committed or deployed."

              git restore docs/fixtures.ics docs/debug.json

              exit 0
            fi

            echo "Fixture changes detected."
            echo "Publishing updated calendar..."

            git add docs/fixtures.ics docs/debug.json

            git commit -m "Refresh Finn and Tate sports fixtures"

            if git push origin HEAD:main; then
              echo "Calendar successfully published."
              exit 0
            fi

            echo "Repository changed during this attempt."
            echo "Retrying in 5 seconds..."

            sleep 5
          done

          echo "Unable to publish calendar after three attempts."
          exit 1

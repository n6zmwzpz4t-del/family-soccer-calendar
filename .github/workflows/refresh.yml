name: Refresh Finn and Tate sports calendar

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths-ignore:
      - "docs/fixtures.ics"
      - "docs/debug.json"
      - "docs/softball.json"

permissions:
  contents: write

concurrency:
  group: finn-tate-sports-calendar-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install --with-deps chromium

      - name: Generate and publish sports data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            if [ -f docs/fixtures.ics ]; then
              cp docs/fixtures.ics /tmp/fixtures-before.ics
            else
              touch /tmp/fixtures-before.ics
            fi

            if [ -f docs/softball.json ]; then
              cp docs/softball.json /tmp/softball-before.json
            else
              printf '{}\n' > /tmp/softball-before.json
            fi

            # Check Squadi and DDMSA, then regenerate local published data.
            python generate_calendar.py

            # DTSTAMP changes every run and is not a meaningful fixture change.
            sed '/^DTSTAMP:/d' /tmp/fixtures-before.ics \
              | tr -d '\r' \
              > /tmp/fixtures-before-compare.ics

            sed '/^DTSTAMP:/d' docs/fixtures.ics \
              | tr -d '\r' \
              > /tmp/fixtures-after-compare.ics

            calendar_changed=0
            softball_changed=0

            if ! cmp -s \
              /tmp/fixtures-before-compare.ics \
              /tmp/fixtures-after-compare.ics
            then
              calendar_changed=1
            fi

            if [ -f docs/softball.json ]; then
              if ! cmp -s \
                /tmp/softball-before.json \
                docs/softball.json
              then
                softball_changed=1
              fi
            fi

            if [ "$calendar_changed" -eq 0 ] \
              && [ "$softball_changed" -eq 0 ]
            then
              echo "No meaningful sports-data changes detected."
              echo "Nothing will be committed or deployed."

              git restore docs/fixtures.ics docs/debug.json

              if git ls-files --error-unmatch docs/softball.json >/dev/null 2>&1; then
                git restore docs/softball.json
              else
                rm -f docs/softball.json
              fi

              exit 0
            fi

            echo "Sports-data changes detected."
            echo "Calendar changed: $calendar_changed"
            echo "DDMSA softball changed: $softball_changed"

            git add docs/fixtures.ics docs/debug.json

            if [ -f docs/softball.json ]; then
              git add docs/softball.json
            fi

            git commit -m "Refresh Finn and Tate sports data"

            if git push origin HEAD:main; then
              echo "Sports data successfully published."
              exit 0
            fi

            echo "Repository changed during this attempt."
            echo "Retrying in 5 seconds..."
            sleep 5
          done

          echo "Unable to publish sports data after three attempts."
          exit 1

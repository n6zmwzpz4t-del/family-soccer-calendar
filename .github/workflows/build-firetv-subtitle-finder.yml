name: Build Fire TV Subtitle Finder

on:
  push:
    branches:
      - firetv-subtitle-finder
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SubtitleFinder-FireTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleFinder-FireTV
          path: SubtitleFinder-FireTV.apk
          if-no-files-found: error

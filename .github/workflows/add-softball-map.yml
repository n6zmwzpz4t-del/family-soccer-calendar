name: Add Tate softball diamond map

on:
  push:
    paths:
      - '.github/workflows/add-softball-map.yml'

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Tate Softball section
        run: python scripts/add_softball_map.py

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Show diamond map in Tate Softball section"
          git push
